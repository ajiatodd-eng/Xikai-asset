<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#EC5E27">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="XIKAI ASSET">
    <title>XIKAI ASSET - Asset & Financial Manager</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg-main: #FDFDF1;
            --accent: #EC5E27;
            --accent-dark: #D64D18;
            --text-primary: #24211E;
            --text-secondary: #6E6A63;
            --shadow-dark: rgba(196, 194, 178, 0.58);
            --shadow-light: rgba(255, 255, 255, 0.96);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        input, textarea, select {
            user-select: text;
        }

        body {
            background-color: #F4F3E6;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .font-display {
            font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
        }

        /* Splash Screen Animation */
        #splash-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: var(--bg-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1), transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
        }

        #splash-screen.splash-hide {
            opacity: 0;
            transform: scale(1.04);
            pointer-events: none;
        }

        .splash-logo-frame {
            animation: splashPop 0.75s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes splashPop {
            0% { transform: scale(0.76) translateY(12px); opacity: 0; }
            65% { transform: scale(1.03) translateY(-2px); opacity: 1; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        /* Shell Mobile-First */
        .app-shell {
            background-color: var(--bg-main);
            min-height: 100vh;
            max-width: 480px;
            margin: 0 auto;
            position: relative;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.06);
            padding-bottom: 106px;
        }

        /* Light Neumorphism Surfaces */
        .neu-flat {
            background: var(--bg-main);
            box-shadow: 7px 7px 15px var(--shadow-dark), -7px -7px 15px var(--shadow-light);
        }

        .neu-flat-sm {
            background: var(--bg-main);
            box-shadow: 4px 4px 9px var(--shadow-dark), -4px -4px 9px var(--shadow-light);
        }

        .neu-inset {
            background: var(--bg-main);
            box-shadow: inset 4px 4px 9px var(--shadow-dark), inset -4px -4px 9px var(--shadow-light);
        }

        .neu-inset-sm {
            background: var(--bg-main);
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
        }

        .neu-btn {
            background: var(--bg-main);
            box-shadow: 4px 4px 9px var(--shadow-dark), -4px -4px 9px var(--shadow-light);
            transition: transform 0.16s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.16s ease, background-color 0.16s ease;
        }

        .neu-btn:hover {
            transform: translateY(-1px);
        }

        .neu-btn:active, .btn-press:active {
            transform: scale(0.95);
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
        }

        .neu-accent-btn {
            background: linear-gradient(135deg, #F46B36 0%, #EC5E27 100%);
            color: #FDFDF1;
            box-shadow: 5px 5px 12px rgba(236, 94, 39, 0.34), -3px -3px 8px var(--shadow-light);
            transition: transform 0.16s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.16s ease, filter 0.16s ease;
        }

        .neu-accent-btn:hover {
            filter: brightness(1.03);
            transform: translateY(-1px);
        }

        .neu-accent-btn:active {
            transform: scale(0.95);
            box-shadow: inset 3px 3px 7px rgba(168, 55, 13, 0.45);
        }

        .neu-card-interactive {
            transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.2s ease;
        }

        .neu-card-interactive:hover {
            transform: translateY(-2px);
            box-shadow: 9px 9px 18px var(--shadow-dark), -9px -9px 18px var(--shadow-light);
        }

        .neu-card-interactive:active {
            transform: scale(0.985);
        }

        .neu-input {
            background: var(--bg-main);
            box-shadow: inset 3px 3px 7px var(--shadow-dark), inset -3px -3px 7px var(--shadow-light);
            border: 1px solid rgba(255, 255, 255, 0.65);
            color: var(--text-primary);
            outline: none;
            transition: box-shadow 0.18s ease, border-color 0.18s ease;
        }

        .neu-input:focus {
            border-color: rgba(236, 94, 39, 0.55);
            box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light), 0 0 0 2px rgba(236, 94, 39, 0.14);
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            background: rgba(253, 253, 241, 0.94);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 -6px 20px rgba(196, 194, 178, 0.38);
            border-top: 1px solid rgba(255, 255, 255, 0.85);
            z-index: 40;
        }

        .tab-btn {
            transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1), color 0.18s ease;
        }

        .tab-btn:active {
            transform: scale(0.92);
        }

        .tab-icon-wrap {
            transition: all 0.22s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .tab-btn.active .tab-icon-wrap {
            background: var(--bg-main);
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
            color: var(--accent);
            transform: translateY(-2px);
        }

        .tab-btn.active .tab-label {
            color: var(--accent);
            font-weight: 800;
        }

        .skeleton-box {
            position: relative;
            overflow: hidden;
            background-color: #EFEEDE;
            box-shadow: inset 2px 2px 5px rgba(196, 194, 178, 0.45), inset -2px -2px 5px rgba(255, 255, 255, 0.85);
        }

        .skeleton-box::after {
            content: "";
            position: absolute;
            inset: 0;
            transform: translateX(-100%);
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.65) 50%, rgba(255,255,255,0) 100%);
            animation: shimmer 1.15s infinite;
        }

        @keyframes shimmer {
            100% { transform: translateX(100%); }
        }

        .modal-backdrop {
            background: rgba(36, 33, 30, 0.44);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            animation: fadeIn 0.2s ease-out;
        }

        .modal-sheet {
            background: var(--bg-main);
            animation: slideUp 0.26s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .modal-dialog {
            background: var(--bg-main);
            animation: popIn 0.22s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0.7; } to { transform: translateY(0); opacity: 1; } }
        @keyframes popIn { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(196, 194, 178, 0.7); border-radius: 999px; }
    </style>
</head>
<body>

<div class="app-shell">
    <!-- TOP HEADER -->
    <header class="px-5 pt-5 pb-3.5 flex items-center justify-between sticky top-0 z-30 bg-[#FDFDF1]/90 backdrop-blur-md">
        <div class="flex items-center gap-3 min-w-0">

            <div class="min-w-0">
                <div class="flex items-center gap-1.5">

    <!-- MAIN CONTAINER -->
    <main id="main-content" class="px-5 pt-1 space-y-5"></main>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav px-2.5 pt-2 pb-3.5">

<div id="modal-root"></div>

<script>
    let cachedBrandIconUrl = '';

    function getXikaiBrandIconUrl(size = 256) {
        if (cachedBrandIconUrl && size === 256) return cachedBrandIconUrl;
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        if (!ctx) return '';

        const r = Math.round(size * 0.22);
        const grad = ctx.createLinearGradient(0, 0, size, size);
        grad.addColorStop(0, '#FF8B3D');
        grad.addColorStop(0.55, '#EC5E27');
        grad.addColorStop(1, '#C84312');

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(r, 0);
        ctx.lineTo(size - r, 0);
        ctx.quadraticCurveTo(size, 0, size, r);
        ctx.lineTo(size, size - r);
        ctx.quadraticCurveTo(size, size, size - r, size);
        ctx.lineTo(r, size);
        ctx.quadraticCurveTo(0, size, 0, size - r);
        ctx.lineTo(0, r);
        ctx.quadraticCurveTo(0, 0, r, 0);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = 'rgba(255, 243, 214, 0.55)';
        ctx.lineWidth = Math.max(2, size * 0.022);
        ctx.stroke();

        const url = canvas.toDataURL('image/png');
        if (size === 256) cachedBrandIconUrl = url;
        return url;
    }

    function applyBrandArtworks() {
        const iconUrl = getXikaiBrandIconUrl(256);
        const splashEl = document.getElementById('splash-logo-container');
        const brandEl = document.getElementById('brand-logo-box');
        if (splashEl) splashEl.innerHTML = `<img src="${iconUrl}" class="w-full h-full object-cover rounded-[26px]">`;
        if (brandEl) brandEl.innerHTML = `<img src="${iconUrl}" class="w-full h-full object-cover rounded-[14px]">`;
    }

    function safeCreateIcons() {
        try { if (window.lucide && typeof window.lucide.createIcons === 'function') window.lucide.createIcons(); } catch (err) {}
    }

    let audioCtx = null;
    function getAudioContext() {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return null;
        if (!audioCtx) audioCtx = new AudioContextClass();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        return audioCtx;
    }

    function playSfx(type = 'tap') {
        try {
            if (!appState || !appState.settings || appState.settings.sfxEnabled === false) return;
            const ctx = getAudioContext();
            if (!ctx) return;
            const now = ctx.currentTime;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            if (type === 'tab') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(340, now); osc.frequency.exponentialRampToValueAtTime(520, now + 0.065);
                gain.gain.setValueAtTime(0.055, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
            } else if (type === 'success') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(480, now); osc.frequency.exponentialRampToValueAtTime(760, now + 0.11);
                gain.gain.setValueAtTime(0.07, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
            } else {
                osc.type = 'sine'; osc.frequency.setValueAtTime(420, now); osc.frequency.exponentialRampToValueAtTime(260, now + 0.045);
                gain.gain.setValueAtTime(0.045, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
            }
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(now); osc.stop(now + 0.08);
        } catch (e) {}
    }

    function playProviderReadySound() {
        try {
            const ctx = getAudioContext();
            if (!ctx) return;
            const now = ctx.currentTime;
            [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(freq, now + (idx * 0.12));
                gain.gain.setValueAtTime(0.01, now + (idx * 0.12));
                gain.gain.linearRampToValueAtTime(0.08, now + (idx * 0.12) + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, now + (idx * 0.12) + 0.15);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(now + (idx * 0.12));
                osc.stop(now + (idx * 0.12) + 0.18);
            });
        } catch (e) {}
    }

    // Fonnte WhatsApp Sender Integration
    async function sendFonnteWhatsAppNotification(messageText) {
        const token = appState.profile.fonnteToken || '';
        const phone = appState.profile.whatsappNumber || '';
        if (!token || !phone) return;

        try {
            const formData = new URLSearchParams();
            formData.append('target', phone);
            formData.append('message', messageText);
            formData.append('countryCode', '62');

            await fetch('https://api.fonnte.com/send', {
                method: 'POST',
                headers: {
                    'Authorization': token,
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: formData.toString()
            });
        } catch (err) {
            console.error('Fonnte API error:', err);
        }
    }

    const STORAGE_KEY = 'xikai_asset_public_whatsapp_v2';
    const blankPublicData = {
        settings: { sfxEnabled: true },
        profile: {
            fullName: 'Pengguna XIKAI',
            shortName: 'Player',
            tagline: 'Growtopia Asset & Profit Manager',
            avatar: '',
            whatsappNumber: '',
            fonnteToken: ''
        },
        ances: { enabled: false, level: 1 },
        projects: [],
        providers: [],
        providerInventory: { gems: 0, fuelPacks: 0, baits: { worm: 0, shiny: 0, salmon: 0, fly: 0, shrimp: 0, mega: 0, uranium: 0 } },
        profitans: [],
        history: []
    };

    let appState = loadState();
    let currentTab = 'project';
    let projectSubFilter = 'all';
    let tempFarmingModalMode = 'paid';
    let tempFarmingBuyCalcMode = 'divide';
    let tempFarmingCalcMode = 'divide';
    let tempNgemassBatches = [{ batchNo: 1, rows: [{ stock: '', price: '' }] }];
    let tempNgemassSeedCountSelector = 1;
    let tempProfitanMode = 'beli';
    let tempProfitanImage = '';
    let activeArchiveTarget = null;
    let tempSubsidiCalcMode = 'multiply';
    let tempBaitSellModes = { worm: 'divide', shiny: 'divide', salmon: 'divide', fly: 'divide', shrimp: 'divide', mega: 'divide', uranium: 'divide' };
    let tempNewProviderType = 'atm';

    function loadState() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
                const parsed = JSON.parse(raw);
                return {
                    settings: { ...blankPublicData.settings, ...(parsed.settings || {}) },
                    profile: { ...blankPublicData.profile, ...(parsed.profile || {}) },
                    ances: { ...blankPublicData.ances, ...(parsed.ances || {}) },
                    projects: Array.isArray(parsed.projects) ? parsed.projects : [],
                    providers: Array.isArray(parsed.providers) ? parsed.providers : [],
                    providerInventory: { ...blankPublicData.providerInventory, ...(parsed.providerInventory || {}) },
                    profitans: Array.isArray(parsed.profitans) ? parsed.profitans : [],
                    history: Array.isArray(parsed.history) ? parsed.history : []
                };
            }
        } catch (e) {}
        const clean = JSON.parse(JSON.stringify(blankPublicData));
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(clean)); } catch (e) {}
        return clean;
    }

    function saveState() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
            syncHeaderProfile();
        } catch (e) {
            showToast('Penyimpanan penuh!');
        }
    }

    function showToast(msg) {
        const box = document.getElementById('toast-box');
        const text = document.getElementById('toast-text');
        if (!box || !text) return;
        text.textContent = msg;
        box.classList.remove('opacity-0', '-translate-y-2');
        box.classList.add('opacity-100', 'translate-y-0');
        clearTimeout(window.__toastTimer);
        window.__toastTimer = setTimeout(() => {
            box.classList.remove('opacity-100', 'translate-y-0');
            box.classList.add('opacity-0', '-translate-y-2');
        }, 2600);
    }

    function syncHeaderProfile() {
        const nameEl = document.getElementById('header-user-name');
        const avatarEl = document.getElementById('header-avatar-box');
        if (nameEl) nameEl.textContent = appState.profile.shortName || 'Player';
        if (avatarEl) {
            if (appState.profile.avatar) {
                avatarEl.innerHTML = `<img src="${appState.profile.avatar}" class="w-full h-full object-cover">`;
            } else {
                avatarEl.textContent = (appState.profile.shortName || 'PL').substring(0, 2).toUpperCase();
            }
        }
    }

    function formatNumber(num) { return (Number(num) || 0).toLocaleString('id-ID', { maximumFractionDigits: 2 }); }

    function formatBglDlWl(totalWl) {
        const raw = Number(totalWl) || 0;
        const isNeg = raw < 0;
        const absWl = Math.abs(raw);
        const bgl = Math.floor(absWl / 10000);
        const rem = absWl % 10000;
        const dl = Math.floor(rem / 100);
        const wl = Number((rem % 100).toFixed(2));
        const parts = [];
        if (bgl > 0) parts.push(`${formatNumber(bgl)} BGL`);
        if (dl > 0) parts.push(`${dl} DL`);
        if (wl > 0 || parts.length === 0) parts.push(`${formatNumber(wl)} WL`);
        return `${isNeg ? '-' : ''}${parts.join(' ')}`;
    }

    function formatWlWithHierarchy(totalWl) {
        const wl = Number(totalWl) || 0;
        return Math.abs(wl) < 100 ? `${formatNumber(wl)} WL` : `${formatNumber(wl)} WL (${formatBglDlWl(wl)})`;
    }

    function renderLineChartSvg(points, strokeColor = '#EC5E27', fillId = 'grad-default', emptyLabel = 'Belum ada data grafik') {
        const vals = (points && points.length > 0) ? points : [0];
        if (vals.length === 1 && vals[0] === 0) {
            return `
                <div class="h-24 rounded-2xl neu-inset-sm flex flex-col items-center justify-center text-center px-3">
                    <span class="text-[11px] font-semibold text-[#6E6A63]">${emptyLabel}</span>
                </div>
            `;
        }
        const series = vals.length === 1 ? [0, vals[0]] : vals;
        const width = 320, height = 84, padX = 10, padY = 12;
        const maxVal = Math.max(...series, 1), minVal = Math.min(...series, 0), span = Math.max(maxVal - minVal, 1);
        const coords = series.map((v, i) => {
            const x = padX + (i / (series.length - 1)) * (width - padX * 2);
            const y = height - padY - ((v - minVal) / span) * (height - padY * 2);
            return { x: Number(x.toFixed(1)), y: Number(y.toFixed(1)), val: v };
        });
        const pathD = coords.map((c, idx) => `${idx === 0 ? 'M' : 'L'} ${c.x} ${c.y}`).join(' ');
        const areaD = `${pathD} L ${coords[coords.length - 1].x} ${height} L ${coords[0].x} ${height} Z`;
        const last = coords[coords.length - 1];

        return `
            <div class="rounded-2xl neu-inset-sm p-2.5">
                <svg viewBox="0 0 ${width} ${height}" class="w-full h-20 overflow-visible">
                    <defs>
                        <linearGradient id="${fillId}" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="${strokeColor}" stop-opacity="0.26" />
                            <stop offset="100%" stop-color="${strokeColor}" stop-opacity="0.01" />
                        </linearGradient>
                    </defs>
                    <path d="${areaD}" fill="url(#${fillId})" />
                    <path d="${pathD}" fill="none" stroke="${strokeColor}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
                    ${coords.map((c, idx) => `<circle cx="${c.x}" cy="${c.y}" r="${idx === coords.length - 1 ? 4 : 2.5}" fill="#FDFDF1" stroke="${strokeColor}" stroke-width="2" />`).join('')}
                </svg>
            </div>
        `;
    }

    function getCumulativeModalSeries() {
        let pSum = 0;
        const projectSeries = appState.projects.slice().reverse().map(p => { pSum += Number(p.modalWl) || 0; return pSum; });
        let provSum = 0;
        const providerSeries = appState.providers.slice().reverse().map(pr => { provSum += Number(pr.totalModalWl) || 0; return provSum; });
        let profSum = 0;
        const profitanSeries = appState.profitans.slice().reverse().map(pf => { profSum += pf.mode === 'beli' ? (Number(pf.modalWl) || 0) : 0; return profSum; });
        return { projectSeries, projectTotalModal: pSum, providerSeries, providerTotalModal: provSum, profitanSeries, profitanTotalModal: profSum };
    }

    function switchTab(tabName) {
        currentTab = tabName;
        playSfx('tab');
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`tab-btn-${tabName}`)?.classList.add('active');
        renderCurrentTab();
    }

    function renderCurrentTab() {
        const main = document.getElementById('main-content');
        if (!main) return;
        if (currentTab === 'project') main.innerHTML = buildProjectTabHtml();
        else if (currentTab === 'provider') main.innerHTML = buildProviderTabHtml();
        else if (currentTab === 'profitan') main.innerHTML = buildProfitanTabHtml();
        else if (currentTab === 'riwayat') main.innerHTML = buildRiwayatTabHtml();
        else if (currentTab === 'profil') main.innerHTML = buildProfilTabHtml();
        safeCreateIcons();
    }

    // --- TAB 1: PROJECT ---
    function calculateFarmingEstWl(proj) {
        const stock = Number(proj.seedStock) || 0, rate = Number(proj.rateValue) || 0;
        return rate <= 0 ? 0 : (proj.calcMode === 'multiply' ? stock * rate : stock / rate);
    }

    function buildProjectTabHtml() {
        let totalEstWl = 0, totalSeedCount = 0;
        appState.projects.forEach(p => {
            if (p.type === 'farming') { totalEstWl += calculateFarmingEstWl(p); totalSeedCount += Number(p.seedStock) || 0; }
            else if (p.type === 'ngemass') { totalEstWl += Number(p.estValueWl) || 0; (p.batches || []).forEach(b => (b.rows || []).forEach(r => totalSeedCount += Number(r.stock) || 0)); }
        });
        const { projectSeries, projectTotalModal } = getCumulativeModalSeries();
        const filteredProjects = appState.projects.filter(p => projectSubFilter === 'all' || p.type === projectSubFilter);

        return `
            <div class="neu-flat rounded-3xl p-5 space-y-3.5">
                <div class="flex items-start justify-between">
                    <div>
                        <span class="text-[11px] font-bold uppercase tracking-wider text-[#6E6A63]">Estimasi Nilai Project</span>
                        <h2 class="font-display font-extrabold text-xl text-[#24211E] mt-1">${formatNumber(totalEstWl)} <span class="text-sm font-extrabold text-[#EC5E27]">WL</span></h2>
                        <span class="text-[11px] font-bold text-[#6E6A63]">${formatBglDlWl(totalEstWl)}</span>
                    </div>
                    <button onclick="openProjectTypeSelectorModal()" class="neu-accent-btn px-3.5 py-2.5 rounded-2xl text-xs font-bold flex items-center gap-1.5">+ Project</button>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div class="neu-inset-sm rounded-2xl p-3"><span class="text-[10px] text-[#6E6A63] block">Modal Seed</span><span class="font-display font-extrabold text-xs">${formatBglDlWl(projectTotalModal)}</span></div>
                    <div class="neu-inset-sm rounded-2xl p-3"><span class="text-[10px] text-[#6E6A63] block">Total Stok Seed</span><span class="font-display font-extrabold text-xs text-[#EC5E27]">${formatNumber(totalSeedCount)} Seed</span></div>
                </div>
                ${renderLineChartSvg(projectSeries, '#EC5E27', 'grad-proj', 'Grafik Modal Project')}
            </div>
            <div class="flex gap-2">
                <button onclick="setProjectFilter('all')" class="px-3 py-1.5 rounded-xl text-xs font-bold ${projectSubFilter === 'all' ? 'neu-accent-btn' : 'neu-btn text-[#6E6A63]'}">Semua</button>
                <button onclick="setProjectFilter('farming')" class="px-3 py-1.5 rounded-xl text-xs font-bold ${projectSubFilter === 'farming' ? 'neu-accent-btn' : 'neu-btn text-[#6E6A63]'}">Farming</button>
                <button onclick="setProjectFilter('ngemass')" class="px-3 py-1.5 rounded-xl text-xs font-bold ${projectSubFilter === 'ngemass' ? 'neu-accent-btn' : 'neu-btn text-[#6E6A63]'}">Ngemass</button>
            </div>
            <div class="space-y-4">
                ${filteredProjects.length === 0 ? `<div class="neu-inset rounded-3xl p-8 text-center text-xs text-[#6E6A63]">Belum ada project tersimpan.</div>` : filteredProjects.map(proj => buildProjectCardHtml(proj)).join('')}
            </div>
        `;
    }

    function setProjectFilter(f) { projectSubFilter = f; renderCurrentTab(); }

    function buildProjectCardHtml(proj) {
        if (proj.type === 'farming') {
            const estWl = calculateFarmingEstWl(proj);
            return `
                <div class="neu-flat rounded-3xl p-4 space-y-3">
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="text-[9px] font-extrabold px-2 py-0.5 rounded-full bg-[#EC5E27]/12 text-[#EC5E27]">FARMING</span>
                            <h3 class="font-display font-extrabold text-sm mt-1">${escapeHtml(proj.name)}</h3>
                            <p class="text-[11px] text-[#6E6A63]">World: ${escapeHtml(proj.world)}</p>
                        </div>
                        <div class="text-right"><span class="font-display font-extrabold text-sm text-[#EC5E27]">${formatNumber(estWl)} WL</span></div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="harvestFarmingSeed('${proj.id}')" class="flex-1 py-2 rounded-xl neu-btn text-xs font-bold">Panen (+${formatNumber(proj.avgHarvest)})</button>
                        <button onclick="openArchiveModal('project', '${proj.id}')" class="py-2 px-4 rounded-xl neu-accent-btn text-xs font-bold">Finish</button>
                    </div>
                </div>
            `;
        } else {
            return `
                <div class="neu-flat rounded-3xl p-4 space-y-3">
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="text-[9px] font-extrabold px-2 py-0.5 rounded-full bg-[#24211E] text-[#FDFDF1]">NGEMASS</span>
                            <h3 class="font-display font-extrabold text-sm mt-1">${escapeHtml(proj.name)}</h3>
                            <p class="text-[11px] text-[#6E6A63]">World: ${escapeHtml(proj.world)}</p>
                        </div>
                        <div class="text-right"><span class="font-display font-extrabold text-sm text-[#EC5E27]">${formatNumber(proj.estValueWl)} WL</span></div>
                    </div>
                    <button onclick="openArchiveModal('project', '${proj.id}')" class="w-full py-2 rounded-xl neu-accent-btn text-xs font-bold">Finish Project</button>
                </div>
            `;
        }
    }

    function harvestFarmingSeed(id) {
        const p = appState.projects.find(x => x.id === id);
        if (!p) return;
        p.seedStock = (Number(p.seedStock) || 0) + (Number(p.avgHarvest) || 0);
        saveState(); renderCurrentTab(); showToast(`Panen +${p.avgHarvest} seed ditambahkan!`);
    }

    function openProjectTypeSelectorModal() {
        const type = prompt('Ketik jenis project ("farming" atau "ngemass"):');
        if (type === 'farming') {
            const name = prompt('Nama Item / Block:');
            const world = prompt('Nama World:');
            if (name && world) {
                appState.projects.unshift({ id: 'proj-' + Date.now(), type: 'farming', name, world: world.toUpperCase(), seedStock: 400, avgHarvest: 120, modalWl: 10, calcMode: 'divide', rateValue: 100 });
                saveState(); renderCurrentTab(); showToast('Farming ditambahkan!');
            }
        } else if (type === 'ngemass') {
            const name = prompt('Nama Item Ngemass:');
            const world = prompt('Nama World:');
            if (name && world) {
                appState.projects.unshift({ id: 'proj-' + Date.now(), type: 'ngemass', name, world: world.toUpperCase(), batches: [{ batchNo: 1, rows: [{ stock: 200, price: 2 }] }], modalWl: 50, estValueWl: 120 });
                saveState(); renderCurrentTab(); showToast('Ngemass ditambahkan!');
            }
        }
    }

    // --- TAB 2: PROVIDER ---
    const PROVIDER_DURATIONS_HOURS = { atm: 22, science: 12, tackle: 48 };
    function getAncesReductionPct() { return appState.ances?.enabled ? (Number(appState.ances?.level) || 1) : 0; }
    function getEffectiveDurationMs(type) {
        const base = PROVIDER_DURATIONS_HOURS[type] || 22;
        return Math.round(base * (1 - getAncesReductionPct() / 100) * 3600 * 1000);
    }
    function formatRemainingTimer(ms) {
        if (ms <= 0) return 'SIAP HARVEST';
        const s = Math.floor(ms / 1000);
        const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
        return `${String(h).padStart(2,'0')}j ${String(m).padStart(2,'0')}m ${String(sec).padStart(2,'0')}d`;
    }

    function buildProviderTabHtml() {
        const { providerSeries, providerTotalModal } = getCumulativeModalSeries();
        const inv = appState.providerInventory;
        return `
            <div class="neu-flat rounded-3xl p-5 space-y-3.5">
                <div class="flex justify-between items-start">
                    <div>
                        <span class="text-[11px] font-bold uppercase tracking-wider text-[#6E6A63]">Modal Provider</span>
                        <h2 class="font-display font-extrabold text-xl mt-1">${formatNumber(providerTotalModal)} <span class="text-sm font-extrabold text-[#EC5E27]">WL</span></h2>
                        <span class="text-[11px] font-bold text-[#6E6A63]">${formatBglDlWl(providerTotalModal)}</span>
                    </div>
                    <button onclick="openNewProviderModal()" class="neu-accent-btn px-3.5 py-2.5 rounded-2xl text-xs font-bold">+ Provider</button>
                </div>
                ${renderLineChartSvg(providerSeries, '#2563EB', 'grad-prov', 'Grafik Modal Provider')}
            </div>
            <div class="neu-flat rounded-3xl p-4 space-y-3">
                <h3 class="font-display font-extrabold text-xs uppercase tracking-wider">Hasil Panen Provider</h3>
                <div class="grid grid-cols-3 gap-2">
                    <div class="neu-inset-sm rounded-2xl p-2.5"><span class="text-[10px] text-[#6E6A63] block">Gems</span><span class="font-display font-extrabold text-xs">${formatNumber(inv.gems)}</span></div>
                    <div class="neu-inset-sm rounded-2xl p-2.5"><span class="text-[10px] text-[#6E6A63] block">Fuel Pack</span><span class="font-display font-extrabold text-xs">${formatNumber(inv.fuelPacks)}</span></div>
                    <div class="neu-inset-sm rounded-2xl p-2.5"><span class="text-[10px] text-[#6E6A63] block">Baits</span><span class="font-display font-extrabold text-xs">${Object.values(inv.baits).reduce((a,b)=>a+b,0)}</span></div>
                </div>
            </div>
            <div class="space-y-4">
                ${appState.providers.length === 0 ? `<div class="neu-inset rounded-3xl p-8 text-center text-xs text-[#6E6A63]">Belum ada World Provider.</div>` : appState.providers.map(p => `
                    <div class="neu-flat rounded-3xl p-4 space-y-3">
                        <div class="flex justify-between items-center">
                            <div><span class="font-display font-extrabold text-sm">${escapeHtml(p.world)}</span> <span class="text-[9px] px-2 py-0.5 rounded-full bg-amber-500/15 text-amber-700 font-bold">${p.providerType.toUpperCase()}</span></div>
                            <span data-prov-timer="${p.id}" class="font-display font-extrabold text-xs text-[#EC5E27]">Memuat...</span>
                        </div>
                        <button onclick="triggerHarvest('${p.id}')" class="w-full py-2.5 rounded-2xl neu-accent-btn text-xs font-bold">Harvest</button>
                    </div>
                `).join('')}
            </div>
        `;
    }

    function openNewProviderModal() {
        const world = prompt('Nama World Provider (ATM/Science/Tackle):');
        if (!world) return;
        appState.providers.unshift({ id: 'prov-' + Date.now(), providerType: 'atm', world: world.toUpperCase(), unitCount: 5000, totalModalWl: 1000, readyAt: 0, notified: false });
        saveState(); renderCurrentTab(); showToast('World Provider ditambahkan!');
    }

    function triggerHarvest(id) {
        const prov = appState.providers.find(p => p.id === id);
        if (!prov) return;
        if (prov.providerType === 'atm') appState.providerInventory.gems += 50000;
        prov.readyAt = Date.now() + getEffectiveDurationMs(prov.providerType);
        prov.notified = false;
        saveState(); renderCurrentTab(); showToast('Harvest berhasil! Timer berjalan.');
    }

    // --- TAB 3: PROFITAN ---
    function buildProfitanTabHtml() {
        const { profitanSeries, profitanTotalModal } = getCumulativeModalSeries();
        return `
            <div class="neu-flat rounded-3xl p-5 space-y-3.5">
                <div>
                    <span class="text-[11px] font-bold uppercase tracking-wider text-[#6E6A63]">Modal Profitan</span>
                    <h2 class="font-display font-extrabold text-xl mt-1">${formatNumber(profitanTotalModal)} <span class="text-sm font-extrabold text-[#EC5E27]">WL</span></h2>
                </div>
                <button onclick="openNewProfitanModal()" class="w-full neu-accent-btn py-2.5 rounded-2xl text-xs font-bold">+ Profitan Baru</button>
                ${renderLineChartSvg(profitanSeries, '#10B981', 'grad-prof', 'Grafik Modal Profitan')}
            </div>
            <div class="space-y-4">
                ${appState.profitans.length === 0 ? `<div class="neu-inset rounded-3xl p-8 text-center text-xs text-[#6E6A63]">Belum ada item profitan.</div>` : appState.profitans.map(item => `
                    <div class="neu-flat rounded-3xl p-4 space-y-3">
                        <div class="flex justify-between">
                            <div><h3 class="font-display font-extrabold text-sm">${escapeHtml(item.name)}</h3><p class="text-[11px] text-[#6E6A63]">${escapeHtml(item.note)}</p></div>
                            <span class="font-display font-extrabold text-sm text-[#EC5E27]">${formatBglDlWl(item.targetWl)}</span>
                        </div>
                        <button onclick="openArchiveModal('profitan', '${item.id}')" class="w-full py-2 rounded-xl neu-accent-btn text-xs font-bold">Sold / Finish</button>
                    </div>
                `).join('')}
            </div>
        `;
    }

    function openNewProfitanModal() {
        const name = prompt('Nama Item / Event Flipping:');
        if (!name) return;
        appState.profitans.unshift({ id: 'prof-' + Date.now(), mode: 'beli', name, note: 'Catatan strategi', image: '', modalWl: 50, targetWl: 90 });
        saveState(); renderCurrentTab(); showToast('Profitan ditambahkan!');
    }

    // --- TAB 4: RIWAYAT ---
    function buildRiwayatTabHtml() {
        let totalClean = 0, running = 0;
        const profitSeries = appState.history.slice().reverse().map(h => { running += Number(h.cleanProfit) || 0; totalClean += Number(h.cleanProfit) || 0; return running; });
        const { projectSeries, providerSeries, profitanSeries } = getCumulativeModalSeries();

        return `
            <div class="neu-flat rounded-3xl p-5 space-y-4">
                <div>
                    <span class="text-[11px] font-bold uppercase tracking-wider text-[#6E6A63]">Akumulasi Clean Profit</span>
                    <h2 class="font-display font-extrabold text-xl text-emerald-600 mt-1">${formatBglDlWl(totalClean)}</h2>
                </div>
                ${renderLineChartSvg(profitSeries, '#059669', 'grad-hist', 'Grafik Clean Profit')}
            </div>
            <div class="neu-flat rounded-3xl p-5 space-y-3">
                <h3 class="font-display font-extrabold text-sm">Grafik Perbandingan Modal</h3>
                ${renderLineChartSvg(projectSeries, '#EC5E27', 'grad-m1', 'Modal Project')}
                ${renderLineChartSvg(providerSeries, '#2563EB', 'grad-m2', 'Modal Provider')}
                ${renderLineChartSvg(profitanSeries, '#10B981', 'grad-m3', 'Modal Profitan')}
            </div>
            <div class="space-y-3">
                ${appState.history.length === 0 ? `<div class="neu-inset rounded-3xl p-8 text-center text-xs text-[#6E6A63]">Belum ada riwayat arsip.</div>` : appState.history.map(h => `
                    <div class="neu-flat rounded-3xl p-4 flex justify-between items-center">
                        <div><span class="text-[9px] font-bold px-2 py-0.5 rounded-full bg-[#EC5E27]/12 text-[#EC5E27]">${escapeHtml(h.category)}</span><h4 class="font-bold text-xs mt-1">${escapeHtml(h.name)}</h4></div>
                        <span class="font-display font-extrabold text-xs text-emerald-600">+${formatBglDlWl(h.cleanProfit)}</span>
                    </div>
                `).join('')}
            </div>
        `;
    }

    // --- TAB 5: PROFIL & WHATSAPP ---
    function buildProfilTabHtml() {
        return `
            <div class="neu-flat rounded-3xl p-5 space-y-4">
                <h3 class="font-display font-extrabold text-sm text-[#24211E]">Pengaturan Profil & WhatsApp Fonnte</h3>
                <form onsubmit="saveProfileForm(event)" class="space-y-3">
                    <div>
                        <label class="block text-xs font-bold text-[#24211E] mb-1">Nama Panggilan</label>
                        <input type="text" id="prof-short" required value="${escapeHtml(appState.profile.shortName)}" class="w-full px-3.5 py-2.5 rounded-2xl neu-input text-xs font-semibold">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-[#24211E] mb-1">Nomor WhatsApp (Penerima Notif)</label>
                        <input type="text" id="prof-wa" value="${escapeHtml(appState.profile.whatsappNumber || '')}" placeholder="Contoh: 087851890210" class="w-full px-3.5 py-2.5 rounded-2xl neu-input text-xs font-semibold">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-[#24211E] mb-1">Token API Fonnte</label>
                        <input type="text" id="prof-token" value="${escapeHtml(appState.profile.fonnteToken || '')}" placeholder="Masukkan Token Fonnte Anda..." class="w-full px-3.5 py-2.5 rounded-2xl neu-input text-xs font-semibold">
                    </div>
                    <button type="submit" class="w-full py-3 rounded-2xl neu-accent-btn font-bold text-xs">Simpan Perubahan Profil</button>
                </form>
            </div>
        `;
    }

    function saveProfileForm(e) {
        e.preventDefault();
        appState.profile.shortName = document.getElementById('prof-short').value.trim();
        appState.profile.whatsappNumber = document.getElementById('prof-wa').value.trim();
        appState.profile.fonnteToken = document.getElementById('prof-token').value.trim();
        saveState(); renderCurrentTab(); showToast('Profil & WhatsApp tersimpan!');
    }

    // --- ARSIP & FINISH MODAL ---
    function openArchiveModal(source, id) {
        const sold = prompt('Masukkan jumlah WL hasil terjual:');
        if (!sold) return;
        const soldWl = Number(sold) || 0;
        let name = '', modal = 0, cat = '';
        if (source === 'project') {
            const idx = appState.projects.findIndex(p => p.id === id);
            if (idx === -1) return;
            const p = appState.projects[idx];
            name = p.name; modal = Number(p.modalWl) || 0; cat = 'Project';
            appState.projects.splice(idx, 1);
        } else {
            const idx = appState.profitans.findIndex(p => p.id === id);
            if (idx === -1) return;
            const pf = appState.profitans[idx];
            name = pf.name; modal = Number(pf.modalWl) || 0; cat = 'Profitan';
            appState.profitans.splice(idx, 1);
        }
        const cleanProfit = soldWl - modal;
        appState.history.unshift({ id: 'hist-' + Date.now(), category: cat, name, soldWl, modalWl: modal, cleanProfit, date: new Date().toLocaleDateString('id-ID') });
        saveState(); renderCurrentTab(); showToast(`Diarsipkan! Clean profit: ${formatBglDlWl(cleanProfit)}`);
    }

    // --- LIVE TIMER & WHATSAPP NOTIFIER ---
    setInterval(() => {
        const now = Date.now();
        let updated = false;
        appState.providers.forEach(p => {
            const readyAt = Number(p.readyAt) || 0;
            if (readyAt > 0 && now >= readyAt && !p.notified) {
                p.notified = true;
                updated = true;
                playProviderReadySound();
                showToast(`Provider ${p.world} SIAP HARVEST!`);
                sendFonnteWhatsAppNotification(`[XIKAI ASSET ALERT]\nProvider di World *${p.world}* (${p.providerType.toUpperCase()}) waktu sudah habis! Segera harvest kembali.`);
            }
            const timerEl = document.querySelector(`[data-prov-timer="${p.id}"]`);
            if (timerEl) timerEl.textContent = formatRemainingTimer(readyAt - now);
        });
        if (updated) saveState();
    }, 1000);

    function escapeHtml(str) {
        return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    window.addEventListener('DOMContentLoaded', () => {
        applyBrandArtworks();
        syncHeaderProfile();
        safeCreateIcons();
        switchTab('project');
        setTimeout(() => document.getElementById('splash-screen')?.remove(), 400);
    });
</script>
</body>
</html>
