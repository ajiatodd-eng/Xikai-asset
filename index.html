<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#FDFDF1">
    <meta name="background-color" content="#FDFDF1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="XIKAI ASSET">
    <title>XIKAI ASSET - Asset & Financial Manager</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg-main: #FDFDF1;
            --accent: #EC5E27;
            --accent-dark: #D64D18;
            --text-primary: #24211E;
            --text-secondary: #6E6A63;
            --shadow-dark: rgba(196, 194, 178, 0.58);
            --shadow-light: rgba(255, 255, 255, 0.96);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        input, textarea, select {
            user-select: text;
        }

        html, body {
            background-color: #FDFDF1;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: auto;
        }

        .font-display {
            font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
        }

        /* Splash Screen Animation (Non-blocking & Bright #FDFDF1) */
        #splash-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background-color: #FDFDF1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.4s cubic-bezier(0.22, 1, 0.36, 1), transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            pointer-events: none;
        }

        #splash-screen.splash-hide {
            opacity: 0;
            transform: scale(1.03);
        }

        .splash-logo-frame {
            animation: splashPop 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes splashPop {
            0% { transform: scale(0.8) translateY(10px); opacity: 0; }
            70% { transform: scale(1.03) translateY(-2px); opacity: 1; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        /* Shell Mobile-First */
        .app-shell {
            background-color: #FDFDF1;
            min-height: 100vh;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            position: relative;
            padding-bottom: 112px;
        }

        /* Light Neumorphism Surfaces */
        .neu-flat {
            background: var(--bg-main);
            box-shadow: 7px 7px 15px var(--shadow-dark), -7px -7px 15px var(--shadow-light);
        }

        .neu-flat-sm {
            background: var(--bg-main);
            box-shadow: 4px 4px 9px var(--shadow-dark), -4px -4px 9px var(--shadow-light);
        }

        .neu-inset {
            background: var(--bg-main);
            box-shadow: inset 4px 4px 9px var(--shadow-dark), inset -4px -4px 9px var(--shadow-light);
        }

        .neu-inset-sm {
            background: var(--bg-main);
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
        }

        .neu-btn {
            background: var(--bg-main);
            box-shadow: 4px 4px 9px var(--shadow-dark), -4px -4px 9px var(--shadow-light);
            transition: transform 0.16s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.16s ease, background-color 0.16s ease;
        }

        .neu-btn:hover {
            transform: translateY(-1px);
        }

        .neu-btn:active, .btn-press:active {
            transform: scale(0.95);
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
        }

        .neu-accent-btn {
            background: linear-gradient(135deg, #F46B36 0%, #EC5E27 100%);
            color: #FDFDF1;
            box-shadow: 5px 5px 12px rgba(236, 94, 39, 0.34), -3px -3px 8px var(--shadow-light);
            transition: transform 0.16s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.16s ease, filter 0.16s ease;
        }

        .neu-accent-btn:hover {
            filter: brightness(1.03);
            transform: translateY(-1px);
        }

        .neu-accent-btn:active {
            transform: scale(0.95);
            box-shadow: inset 3px 3px 7px rgba(168, 55, 13, 0.45);
        }

        /* Card Interactive Hover & Spring Press */
        .neu-card-interactive {
            transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.2s ease;
        }

        .neu-card-interactive:hover {
            transform: translateY(-2px);
            box-shadow: 9px 9px 18px var(--shadow-dark), -9px -9px 18px var(--shadow-light);
        }

        .neu-card-interactive:active {
            transform: scale(0.985);
        }

        /* Input Styling */
        .neu-input {
            background: var(--bg-main);
            box-shadow: inset 3px 3px 7px var(--shadow-dark), inset -3px -3px 7px var(--shadow-light);
            border: 1px solid rgba(255, 255, 255, 0.65);
            color: var(--text-primary);
            outline: none;
            transition: box-shadow 0.18s ease, border-color 0.18s ease;
        }

        .neu-input:focus {
            border-color: rgba(236, 94, 39, 0.55);
            box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light), 0 0 0 2px rgba(236, 94, 39, 0.14);
        }

        /* Bottom Tab Bar (5 Tabs) */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            background: rgba(253, 253, 241, 0.96);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 -6px 20px rgba(196, 194, 178, 0.38);
            border-top: 1px solid rgba(255, 255, 255, 0.85);
            z-index: 40;
        }

        .tab-btn {
            transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1), color 0.18s ease;
        }

        .tab-btn:active {
            transform: scale(0.92);
        }

        .tab-icon-wrap {
            transition: all 0.22s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .tab-btn.active .tab-icon-wrap {
            background: var(--bg-main);
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
            color: var(--accent);
            transform: translateY(-2px);
        }

        .tab-btn.active .tab-label {
            color: var(--accent);
            font-weight: 800;
        }

        /* Skeleton Shimmer Animation */
        .skeleton-box {
            position: relative;
            overflow: hidden;
            background-color: #EFEEDE;
            box-shadow: inset 2px 2px 5px rgba(196, 194, 178, 0.45), inset -2px -2px 5px rgba(255, 255, 255, 0.85);
        }

        .skeleton-box::after {
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            transform: translateX(-100%);
            background: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.65) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            animation: shimmer 1.15s infinite;
        }

        @keyframes shimmer {
            100% {
                transform: translateX(100%);
            }
        }

        /* Modal Backdrop & Sheet Transition */
        .modal-backdrop {
            background: rgba(36, 33, 30, 0.44);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            animation: fadeIn 0.2s ease-out;
        }

        .modal-sheet {
            background: var(--bg-main);
            animation: slideUp 0.26s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .modal-dialog {
            background: var(--bg-main);
            animation: popIn 0.22s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0.7; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes popIn {
            from { transform: scale(0.92); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(196, 194, 178, 0.7);
            border-radius: 999px;
        }
    </style>
</head>
<body>

<!-- SPLASH / OPENING ANIMATION (BRIGHT #FDFDF1 & NON-BLOCKING) -->
<div id="splash-screen">
    <div class="splash-logo-frame flex flex-col items-center gap-4">
        <div id="splash-logo-container" class="w-32 h-32 rounded-[34px] neu-flat p-2 flex items-center justify-center overflow-hidden border border-white">
            <!-- Rendered with Full XIKAI ASSET Character Artwork -->
        </div>
        <div class="text-center">
            <h1 class="font-display font-extrabold text-xl tracking-tight text-[#24211E]">XIKAI <span class="text-[#EC5E27]">ASSET</span></h1>
            <p class="text-xs font-semibold text-[#6E6A63] mt-0.5">Smart Farming, Provider & Profit Manager</p>
        </div>
        <div class="w-32 h-1.5 rounded-full neu-inset-sm overflow-hidden mt-1">
            <div class="h-full bg-[#EC5E27] rounded-full animate-pulse" style="width: 100%;"></div>
        </div>
    </div>
</div>

<div class="app-shell">
    <!-- TOP HEADER -->
    <header class="px-5 pt-5 pb-3.5 flex items-center justify-between sticky top-0 z-30 bg-[#FDFDF1]/95 backdrop-blur-md">
        <div class="flex items-center gap-3 min-w-0">
            <div id="brand-logo-box" class="w-11 h-11 rounded-2xl neu-flat-sm p-0.5 flex items-center justify-center border border-white/80 overflow-hidden shrink-0">
                <!-- Custom XIKAI ASSET Full Character Icon -->
            </div>
            <div class="min-w-0">
                <div class="flex items-center gap-1.5">
                    <h1 class="font-display font-extrabold text-base tracking-tight text-[#24211E] leading-none">XIKAI</h1>
                    <span class="text-[9px] font-extrabold tracking-wider px-2 py-0.5 rounded-full bg-[#EC5E27]/12 text-[#EC5E27]">ASSET</span>
                </div>
                <p id="header-subtitle" class="text-[11px] font-medium text-[#6E6A63] mt-1 truncate">Manajemen Project Farming & Ngemass</p>
            </div>
        </div>

        <!-- Profile Pill Top Right -->
        <button type="button" onclick="switchTab('profil')" class="neu-btn rounded-full py-1.5 pl-1.5 pr-3 flex items-center gap-2 border border-white/70 shrink-0">
            <div id="header-avatar-box" class="w-7 h-7 rounded-full bg-[#EC5E27] text-[#FDFDF1] font-display font-extrabold text-[11px] flex items-center justify-center overflow-hidden shrink-0">
                PL
            </div>
            <span id="header-user-name" class="text-xs font-bold text-[#24211E] max-w-[70px] truncate">Player</span>
        </button>
    </header>

    <!-- MAIN CONTENT CONTAINER -->
    <main id="main-content" class="px-5 pt-1 space-y-5">
        <!-- Rendered dynamically by JS -->
    </main>

    <!-- BOTTOM TAB BAR (5 MENU: PROJECT, PROVIDER, PROFITAN, RIWAYAT, PROFIL) -->
    <nav class="bottom-nav px-2.5 pt-2 pb-3.5">
        <div class="grid grid-cols-5 gap-1">
            <button type="button" id="tab-btn-project" onclick="switchTab('project')" class="tab-btn active flex flex-col items-center justify-center gap-1 py-1 text-[#6E6A63]">
                <div class="tab-icon-wrap w-10 h-8 rounded-2xl flex items-center justify-center">
                    <i data-lucide="sprout" class="w-4 h-4"></i>
                </div>
                <span class="tab-label text-[10px] font-semibold">Project</span>
            </button>

            <button type="button" id="tab-btn-provider" onclick="switchTab('provider')" class="tab-btn flex flex-col items-center justify-center gap-1 py-1 text-[#6E6A63]">
                <div class="tab-icon-wrap w-10 h-8 rounded-2xl flex items-center justify-center">
                    <i data-lucide="cpu" class="w-4 h-4"></i>
                </div>
                <span class="tab-label text-[10px] font-semibold">Provider</span>
            </button>

            <button type="button" id="tab-btn-profitan" onclick="switchTab('profitan')" class="tab-btn flex flex-col items-center justify-center gap-1 py-1 text-[#6E6A63]">
                <div class="tab-icon-wrap w-10 h-8 rounded-2xl flex items-center justify-center">
                    <i data-lucide="trending-up" class="w-4 h-4"></i>
                </div>
                <span class="tab-label text-[10px] font-semibold">Profitan</span>
            </button>

            <button type="button" id="tab-btn-riwayat" onclick="switchTab('riwayat')" class="tab-btn flex flex-col items-center justify-center gap-1 py-1 text-[#6E6A63]">
                <div class="tab-icon-wrap w-10 h-8 rounded-2xl flex items-center justify-center">
                    <i data-lucide="archive" class="w-4 h-4"></i>
                </div>
                <span class="tab-label text-[10px] font-semibold">Riwayat</span>
            </button>

            <button type="button" id="tab-btn-profil" onclick="switchTab('profil')" class="tab-btn flex flex-col items-center justify-center gap-1 py-1 text-[#6E6A63]">
                <div class="tab-icon-wrap w-10 h-8 rounded-2xl flex items-center justify-center">
                    <i data-lucide="user" class="w-4 h-4"></i>
                </div>
                <span class="tab-label text-[10px] font-semibold">Profil</span>
            </button>
        </div>
    </nav>
</div>

<!-- MODAL CONTAINER -->
<div id="modal-root"></div>

<!-- TOAST MESSAGE -->
<div id="toast-box" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-all duration-200">
    <div class="px-4 py-2.5 rounded-2xl bg-[#24211E] text-[#FDFDF1] text-xs font-semibold shadow-xl flex items-center gap-2 max-w-[90vw]">
        <span class="w-2 h-2 rounded-full bg-[#EC5E27] shrink-0"></span>
        <span id="toast-text" class="truncate">Tersimpan</span>
    </div>
</div>

<script>
    // ==========================================
    // FULL CHARACTER ILLUSTRATION ARTWORK FOR XIKAI ASSET
    // (Chicken Hood Character + Blue Dragon + Golden Winged Block + Growtopia Sign + Crown XIKAI ASSET)
    // ==========================================
    const iconCacheBySize = {};

    function drawRoundedRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
    }

    function getXikaiBrandIconUrl(size = 256) {
        if (appState?.settings?.customAppIcon) {
            return appState.settings.customAppIcon;
        }
        if (iconCacheBySize[size]) return iconCacheBySize[size];

        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        if (!ctx) return '';

        const s = size / 512; // Normalized scale based on 512x512 master canvas
        ctx.save();

        // Clip rounded square icon frame
        drawRoundedRect(ctx, 0, 0, size, size, 108 * s);
        ctx.clip();

        // 1. Vibrant Orange-Gold Sky Gradient
        const skyGrad = ctx.createLinearGradient(0, 0, 0, size);
        skyGrad.addColorStop(0, '#FF6B1A');
        skyGrad.addColorStop(0.55, '#FF9E2C');
        skyGrad.addColorStop(1, '#FFF3D6');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, size, size);

        // Soft glowing sun aura behind character
        const aura = ctx.createRadialGradient(270 * s, 210 * s, 20 * s, 270 * s, 210 * s, 240 * s);
        aura.addColorStop(0, 'rgba(255, 250, 224, 0.95)');
        aura.addColorStop(0.6, 'rgba(255, 214, 102, 0.35)');
        aura.addColorStop(1, 'rgba(255, 140, 40, 0)');
        ctx.fillStyle = aura;
        ctx.fillRect(0, 0, size, size);

        // Fluffy Clouds
        ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
        const drawCloud = (cx, cy, r) => {
            ctx.beginPath();
            ctx.arc(cx * s, cy * s, r * s, 0, Math.PI * 2);
            ctx.arc((cx + r * 0.8) * s, (cy + 4) * s, r * 0.78 * s, 0, Math.PI * 2);
            ctx.arc((cx - r * 0.8) * s, (cy + 6) * s, r * 0.72 * s, 0, Math.PI * 2);
            ctx.fill();
        };
        drawCloud(88, 122, 34);
        drawCloud(418, 118, 36);
        drawCloud(96, 390, 46);
        drawCloud(412, 395, 48);

        // 2. Floating Pixel Dirt & Grass Islands (Left & Right)
        const drawFloatingIsland = (ix, iy, iw, ih) => {
            ctx.fillStyle = '#7C4A27';
            drawRoundedRect(ctx, ix * s, (iy + 10) * s, iw * s, ih * s, 6 * s);
            ctx.fill();
            ctx.fillStyle = '#5BB431';
            drawRoundedRect(ctx, (ix - 3) * s, iy * s, (iw + 6) * s, 16 * s, 5 * s);
            ctx.fill();
        };
        drawFloatingIsland(42, 185, 58, 46);
        drawFloatingIsland(402, 165, 66, 52);

        // 3. Golden Winged Block (Top Left Companion)
        ctx.save();
        ctx.translate(106 * s, 118 * s);
        ctx.rotate(-0.14);
        // White wings
        ctx.fillStyle = '#FFFFFF';
        ctx.strokeStyle = '#3B2314';
        ctx.lineWidth = 3 * s;
        ctx.beginPath();
        ctx.ellipse(-34 * s, -4 * s, 20 * s, 10 * s, -0.35, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.beginPath();
        ctx.ellipse(34 * s, -4 * s, 20 * s, 10 * s, 0.35, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        // Golden block body
        ctx.fillStyle = '#FFD426';
        drawRoundedRect(ctx, -22 * s, -22 * s, 44 * s, 44 * s, 8 * s);
        ctx.fill();
        ctx.stroke();
        // Pixel eyes & mouth
        ctx.fillStyle = '#241811';
        ctx.fillRect(-11 * s, -9 * s, 6 * s, 6 * s);
        ctx.fillRect(5 * s, -9 * s, 6 * s, 6 * s);
        ctx.fillRect(-6 * s, 3 * s, 12 * s, 9 * s);
        ctx.restore();

        // 4. Pixel Blue Dragon Companion (Left Side)
        ctx.save();
        // Dragon body & head
        ctx.fillStyle = '#1D74D8';
        ctx.strokeStyle = '#102A4C';
        ctx.lineWidth = 3.5 * s;
        drawRoundedRect(ctx, 84 * s, 212 * s, 56 * s, 48 * s, 10 * s); // Head
        ctx.fill();
        ctx.stroke();
        drawRoundedRect(ctx, 94 * s, 256 * s, 54 * s, 76 * s, 12 * s); // Torso
        ctx.fill();
        ctx.stroke();
        // Light blue belly
        ctx.fillStyle = '#6CC4FF';
        drawRoundedRect(ctx, 118 * s, 266 * s, 24 * s, 56 * s, 6 * s);
        ctx.fill();
        // Dragon snout & open mouth
        ctx.fillStyle = '#2B8BF2';
        drawRoundedRect(ctx, 126 * s, 218 * s, 32 * s, 34 * s, 6 * s);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#D9383A';
        ctx.fillRect(132 * s, 232 * s, 22 * s, 12 * s);
        // Dragon eyes
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(114 * s, 204 * s, 12 * s, 12 * s);
        ctx.fillRect(128 * s, 204 * s, 12 * s, 12 * s);
        ctx.fillStyle = '#111111';
        ctx.fillRect(119 * s, 208 * s, 5 * s, 6 * s);
        ctx.fillRect(133 * s, 208 * s, 5 * s, 6 * s);
        ctx.restore();

        // 5. Wooden "Growtopia" Signboard (Right Side)
        ctx.save();
        ctx.translate(414 * s, 268 * s);
        ctx.rotate(-0.08);
        ctx.fillStyle = '#7C4A27';
        ctx.fillRect(-8 * s, 20 * s, 16 * s, 48 * s);
        ctx.fillStyle = '#A86434';
        ctx.strokeStyle = '#3E200D';
        ctx.lineWidth = 3.5 * s;
        drawRoundedRect(ctx, -64 * s, -22 * s, 128 * s, 48 * s, 8 * s);
        ctx.fill();
        ctx.stroke();
        // Little tree icon on sign
        ctx.fillStyle = '#5BB431';
        ctx.beginPath();
        ctx.arc(0, -24 * s, 16 * s, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#FFE066';
        ctx.font = `900 ${Math.round(18 * s)}px "Plus Jakarta Sans", Inter, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('Growtopia', 0, 3 * s);
        ctx.restore();

        // 6. Main Character (Chicken Hood, Blue Glasses, Blue Cape & White Tunic)
        ctx.save();
        // Blue Hero Cape
        ctx.fillStyle = '#1E6FD9';
        ctx.strokeStyle = '#12294A';
        ctx.lineWidth = 4 * s;
        ctx.beginPath();
        ctx.moveTo(185 * s, 240 * s);
        ctx.lineTo(140 * s, 355 * s);
        ctx.lineTo(368 * s, 355 * s);
        ctx.lineTo(332 * s, 240 * s);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // White Tunic Torso with Gold Cross Emblem
        ctx.fillStyle = '#F8F7F2';
        drawRoundedRect(ctx, 204 * s, 242 * s, 118 * s, 110 * s, 20 * s);
        ctx.fill();
        ctx.stroke();
        // Gold pixel cross on chest
        ctx.fillStyle = '#F4B41A';
        ctx.fillRect(256 * s, 272 * s, 16 * s, 46 * s);
        ctx.fillRect(241 * s, 287 * s, 46 * s, 16 * s);

        // White Chicken Hood Outer
        ctx.fillStyle = '#FFFFFF';
        ctx.strokeStyle = '#2B1B12';
        ctx.lineWidth = 4 * s;
        drawRoundedRect(ctx, 184 * s, 96 * s, 154 * s, 152 * s, 36 * s);
        ctx.fill();
        ctx.stroke();

        // Red Chicken Comb on Top of Hood
        ctx.fillStyle = '#E63926';
        ctx.beginPath();
        ctx.ellipse(238 * s, 82 * s, 18 * s, 26 * s, -0.35, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.beginPath();

    let audioCtx = null;

    function getAudioContext() {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return null;
        if (!audioCtx) audioCtx = new AudioContextClass();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        return audioCtx;
    }

    function playSfx(type = 'tap') {
        try {
            if (!appState || !appState.settings || appState.settings.sfxEnabled === false) return;
            const ctx = getAudioContext();
            if (!ctx) return;

            const now = ctx.currentTime;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            if (type === 'tab') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(340, now);
                osc.frequency.exponentialRampToValueAtTime(520, now + 0.065);
                gain.gain.setValueAtTime(0.055, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.075);
            } else if (type === 'success') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(480, now);
                osc.frequency.exponentialRampToValueAtTime(760, now + 0.11);
                gain.gain.setValueAtTime(0.07, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.14);
            } else if (type === 'ui-pop') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(580, now);
                osc.frequency.exponentialRampToValueAtTime(740, now + 0.04);
                gain.gain.setValueAtTime(0.032, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.045);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.05);
            } else {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(420, now);
                osc.frequency.exponentialRampToValueAtTime(260, now + 0.045);
                gain.gain.setValueAtTime(0.045, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.055);
            }
        } catch (e) {}
    }

    function synthesizeTriumphantFanfare() {
        try {
            const ctx = getAudioContext();
            if (!ctx) return;
            const now = ctx.currentTime;
            const notes = [
                { freq: 523.25, start: 0.00, dur: 0.14 },
                { freq: 659.25, start: 0.12, dur: 0.14 },
                { freq: 783.99, start: 0.24, dur: 0.16 },
                { freq: 1046.50, start: 0.38, dur: 0.42 }
            ];
            notes.forEach(n => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(n.freq, now + n.start);

                const filter = ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(2400, now + n.start);

                gain.gain.setValueAtTime(0.001, now + n.start);
                gain.gain.linearRampToValueAtTime(0.08, now + n.start + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, now + n.start + n.dur);

                osc.connect(filter);
                filter.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now + n.start);
                osc.stop(now + n.start + n.dur + 0.02);
            });
        } catch (e) {}
    }

    // ==========================================
    // STRICT GROWTOPIA CURRENCY CONVERSION (WL -> DL -> BGL)
    // 100 WL = 1 DL | 100 DL (10,000 WL) = 1 BGL
    // ==========================================
    function formatNumber(num) {
        const n = Number(num) || 0;
        return n.toLocaleString('id-ID', { maximumFractionDigits: 2 });
    }

    function formatBglDlWl(totalWl) {
        const raw = Number(totalWl) || 0;
        const isNeg = raw < 0;
        const absWl = Math.abs(raw);

        const bgl = Math.floor(absWl / 10000);
        const remAfterBgl = absWl % 10000;
        const dl = Math.floor(remAfterBgl / 100);
        const wl = Number((remAfterBgl % 100).toFixed(2));

        const parts = [];
        if (bgl > 0) parts.push(`${formatNumber(bgl)} BGL`);
        if (dl > 0) parts.push(`${dl} DL`);
        if (wl > 0 || parts.length === 0) parts.push(`${formatNumber(wl)} WL`);

        return `${isNeg ? '-' : ''}${parts.join(' ')}`;
    }

    function formatWlWithHierarchy(totalWl) {
        const wl = Number(totalWl) || 0;
        if (Math.abs(wl) < 100) {
            return `${formatNumber(wl)} WL`;
        }
        return `${formatNumber(wl)} WL (${formatBglDlWl(wl)})`;
    }

    // ==========================================
    // SVG LINE CHART BUILDER (STATISTIK GARIS)
    // ==========================================
    function renderLineChartSvg(points, strokeColor = '#EC5E27', fillId = 'grad-default', emptyLabel = 'Belum ada data grafik') {
        const vals = (points && points.length > 0) ? points : [0];
        if (vals.length === 1 && vals[0] === 0) {
            return `
                <div class="h-24 rounded-2xl neu-inset-sm flex flex-col items-center justify-center text-center px-3">
                    <span class="text-[11px] font-semibold text-[#6E6A63]">${emptyLabel}</span>
                    <span class="text-[10px] text-[#6E6A63]/75 mt-0.5">Grafik garis akan muncul otomatis saat data bertambah</span>
                </div>
            `;
        }

        const series = vals.length === 1 ? [0, vals[0]] : vals;
        const width = 320;
        const height = 84;
        const padX = 10;
        const padY = 12;

        const maxVal = Math.max(...series, 1);
        const minVal = Math.min(...series, 0);
        const span = Math.max(maxVal - minVal, 1);

        const coords = series.map((v, i) => {
            const x = padX + (i / (series.length - 1)) * (width - padX * 2);
            const y = height - padY - ((v - minVal) / span) * (height - padY * 2);
            return { x: Number(x.toFixed(1)), y: Number(y.toFixed(1)), val: v };
        });

        const pathD = coords.map((c, idx) => `${idx === 0 ? 'M' : 'L'} ${c.x} ${c.y}`).join(' ');
        const areaD = `${pathD} L ${coords[coords.length - 1].x} ${height} L ${coords[0].x} ${height} Z`;
        const last = coords[coords.length - 1];

        return `
            <div class="rounded-2xl neu-inset-sm p-2.5">
                <svg viewBox="0 0 ${width} ${height}" class="w-full h-20 overflow-visible">
                    <defs>
                        <linearGradient id="${fillId}" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="${strokeColor}" stop-opacity="0.26" />
                            <stop offset="100%" stop-color="${strokeColor}" stop-opacity="0.01" />
                        </linearGradient>
                    </defs>
                    <line x1="${padX}" y1="${height - padY}" x2="${width - padX}" y2="${height - padY}" stroke="#D8D5C5" stroke-width="1" stroke-dasharray="3 3" />
                    <path d="${areaD}" fill="url(#${fillId})" />
                    <path d="${pathD}" fill="none" stroke="${strokeColor}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
                    ${coords.map((c, idx) => `
                        <circle cx="${c.x}" cy="${c.y}" r="${idx === coords.length - 1 ? 4 : 2.5}" fill="#FDFDF1" stroke="${strokeColor}" stroke-width="2" />
                    `).join('')}
                    <circle cx="${last.x}" cy="${last.y}" r="6.5" fill="${strokeColor}" fill-opacity="0.18" />
                </svg>
            </div>
        `;
    }

    function calculateFarmingEstWl(proj) {
        const stock = Number(proj.seedStock) || 0;
        const rate = Number(proj.rateValue) || 0;
        if (rate <= 0) return 0;
        return proj.calcMode === 'multiply' ? stock * rate : stock / rate;
    }

    function buildProjectTabHtml() {
        let totalEstWl = 0;
        let totalSeedCount = 0;

        appState.projects.forEach(p => {
            if (p.type === 'farming') {

    function harvestFarmingSeed(projId) {
        const proj = appState.projects.find(p => p.id === projId);
        if (!proj) return;
        const addAmt = Number(proj.avgHarvest) || 0;
        proj.seedStock = (Number(proj.seedStock) || 0) + addAmt;
        saveState();
        playSfx('success');
        renderCurrentTab();
        showToast(`Panen +${formatNumber(addAmt)} seed ditambahkan ke ${proj.name}!`);
    }

            secFree?.classList.add('hidden');

                btnMul.className = 'px-2.5 py-1 rounded-lg text-[11px] font-extrabold transition-all neu-accent-btn';

    }

    function updateFarmingPreview() {
        const stock = Number(document.getElementById('farm-stock')?.value) || 0;
        const sellRate = Number(document.getElementById('farm-rate')?.value) || 0;
        const buyRate = Number(document.getElementById('farm-buy-rate')?.value) || 0;

        const modalPrevEl = document.getElementById('farm-modal-preview');
        if (modalPrevEl) {
            let modalWl = 0;
            if (tempFarmingModalMode === 'paid' && buyRate > 0) {
                modalWl = tempFarmingBuyCalcMode === 'multiply' ? stock * buyRate : stock / buyRate;
            }
            modalPrevEl.textContent = formatWlWithHierarchy(modalWl);
        }

        const estPrevEl = document.getElementById('farm-est-preview');
        if (estPrevEl) {
            let estWl = 0;
            if (sellRate > 0) {
                estWl = tempFarmingCalcMode === 'multiply' ? stock * sellRate : stock / sellRate;
            }
            estPrevEl.textContent = formatWlWithHierarchy(estWl);
        }
    }

    function submitNewFarmingProject(e) {
        e.preventDefault();
        const name = document.getElementById('farm-name').value.trim();
        const world = document.getElementById('farm-world').value.trim().toUpperCase();
        const seedStock = Number(document.getElementById('farm-stock').value) || 0;
        const avgHarvest = Number(document.getElementById('farm-harvest').value) || 0;
        const rateValue = Number(document.getElementById('farm-rate').value) || 1;
        const buyRate = Number(document.getElementById('farm-buy-rate')?.value) || 0;

        if (!name || !world) return;

        let modalWl = 0;
        if (tempFarmingModalMode === 'paid' && buyRate > 0) {
            modalWl = tempFarmingBuyCalcMode === 'multiply' ? seedStock * buyRate : seedStock / buyRate;
        }

        appState.projects.unshift({
            id: 'proj-' + Date.now(),
            type: 'farming',
            name,
            world,
            seedStock,
            avgHarvest,
            modalMode: tempFarmingModalMode,
            modalWl: Number(modalWl.toFixed(2)),
            calcMode: tempFarmingCalcMode,
            rateValue,
            createdAt: new Date().toLocaleDateString('id-ID', { day: '2-digit', month: 'short' })
        });

        saveState();
        playSfx('success');
        closeModal();
        renderCurrentTab();
        showToast(`Project Farming "${name}" berhasil disimpan!`);
    }

    function updateNgemassRowValue(batchIdx, rowIdx, field, val) {
        if (tempNgemassBatches[batchIdx] && tempNgemassBatches[batchIdx].rows[rowIdx]) {
            tempNgemassBatches[batchIdx].rows[rowIdx][field] = val;
        }
    }

    function addRowInNgemassBatch(batchIdx) {
        if (!tempNgemassBatches[batchIdx]) return;
        tempNgemassBatches[batchIdx].rows.push({ stock: '', price: '' });
        renderNgemassModalContent();
    }

    function removeRowInNgemassBatch(batchIdx, rowIdx) {
        if (!tempNgemassBatches[batchIdx]) return;
        tempNgemassBatches[batchIdx].rows.splice(rowIdx, 1);
        renderNgemassModalContent();
    }

    function addNextNgemassBatchGroup() {
        if (tempNgemassBatches.length >= 5) return;
        const nextNo = tempNgemassBatches.length + 1;
        const count = Math.min(5, Math.max(1, Number(tempNgemassSeedCountSelector) || 1));
        const newRows = [];
        for (let i = 0; i < count; i++) newRows.push({ stock: '', price: '' });
        tempNgemassBatches.push({ batchNo: nextNo, rows: newRows });
        renderNgemassModalContent();
    }

    function removeNgemassBatch(batchIdx) {
        tempNgemassBatches.splice(batchIdx, 1);
        tempNgemassBatches.forEach((b, idx) => { b.batchNo = idx + 1; });
        renderNgemassModalContent();
    }

    function updateNgemassDlPreview() {
        const estEl = document.getElementById('ngemass-est');
        const badgeEl = document.getElementById('ngemass-dl-badge');
        if (!estEl || !badgeEl) return;
        badgeEl.textContent = formatBglDlWl(Number(estEl.value) || 0);
    }

    function submitNewNgemassProject(e) {
        e.preventDefault();
        const name = document.getElementById('ngemass-name').value.trim();
        const world = document.getElementById('ngemass-world').value.trim().toUpperCase();
        const modalWl = Number(document.getElementById('ngemass-modal')?.value) || 0;
        const estValueWl = Number(document.getElementById('ngemass-est').value) || 0;
        if (!name || !world) return;

        const cleanedBatches = tempNgemassBatches.map((b, idx) => ({
            batchNo: idx + 1,
            rows: b.rows.map(r => ({
                stock: Number(r.stock) || 0,
                price: Number(r.price) || 0
            }))
        }));

        appState.projects.unshift({
            id: 'proj-' + Date.now(),
            type: 'ngemass',
            name,
            world,
            batches: cleanedBatches,
            modalWl,
            estValueWl,
            createdAt: new Date().toLocaleDateString('id-ID', { day: '2-digit', month: 'short' })
        });

        saveState();
        playSfx('success');
        closeModal();
        renderCurrentTab();
        showToast(`Project Ngemass "${name}" berhasil disimpan!`);
    }

    // ==========================================
    // TAB 2: PROVIDER (ATM, SCIENCE STATION, TACKLE + ANCES)
    // ==========================================
    const PROVIDER_DURATIONS_HOURS = {
        atm: 22,
        science: 12,
        tackle: 48
    };

    function getAncesReductionPct() {
        if (!appState.ances || !appState.ances.enabled) return 0;
        const lvl = Math.min(6, Math.max(1, Number(appState.ances.level) || 1));
        return lvl;
    }

    function getEffectiveDurationMs(type) {
        const baseHours = PROVIDER_DURATIONS_HOURS[type] || 22;
        const pct = getAncesReductionPct();
        const effectiveHours = baseHours * (1 - pct / 100);
        return Math.round(effectiveHours * 3600 * 1000);
    }

    function formatRemainingTimer(ms) {
        if (ms <= 0) return 'SIAP HARVEST';
        const totalSec = Math.floor(ms / 1000);
        const h = Math.floor(totalSec / 3600);
        const m = Math.floor((totalSec % 3600) / 60);
        const s = totalSec % 60;
        return `${String(h).padStart(2, '0')}j ${String(m).padStart(2, '0')}m ${String(s).padStart(2, '0')}d`;
    }

                        <p class="text-xs text-[#6E6A63]">Ketuk <strong>+ World Provider</strong> untuk menambah ATM, Science Station, atau Tackle.</p>
                    </div>
                ` : appState.providers.map(prov => buildProviderCardHtml(prov)).join('')}
            </div>
        `;
    }

    function buildProviderCardHtml(prov) {
        const typeLabels = {
            atm: { label: 'ATM (22 Jam)', icon: 'landmark', badge: 'bg-amber-500/15 text-amber-700' },
            science: { label: 'SCIENCE (12 Jam)', icon: 'flask-conical', badge: 'bg-blue-500/15 text-blue-700' },

                </div>

                <div class="neu-inset-sm rounded-2xl px-3.5 py-2.5 flex items-center justify-between">
                    <span class="text-[11px] font-semibold text-[#6E6A63] flex items-center gap-1.5">

    function setSubsidiMode(mode) {
        tempSubsidiCalcMode = mode;

        const hint = document.getElementById('sub-hint');
        if (bMul && bDiv) {

        }
        if (hint) {
            hint.textContent = mode === 'multiply'
                ? 'Contoh Kali: 200 × 6.8 = 1.360 WL'
                : 'Contoh Bagi (200/85): masukkan 85';
        }
        updateSubsidiPreview();
    }

    function updateSubsidiPreview() {
        const qty = Number(document.getElementById('sub-unit-qty')?.value) || 0;
        const rate = Number(document.getElementById('sub-unit-rate')?.value) || 0;
        const out = document.getElementById('sub-total-preview');
        if (!out) return;

        let costWl = 0;
        if (rate > 0) {
            costWl = tempSubsidiCalcMode === 'multiply' ? qty * rate : (qty / 200) * rate;
        }
        out.textContent = formatWlWithHierarchy(Number(costWl.toFixed(2)));
    }

    function submitSubsidiProvider(e, provId) {
        e.preventDefault();
        const prov = appState.providers.find(p => p.id === provId);
        if (!prov) return;

        const sisaSlot = Math.max(0, 5392 - (Number(prov.unitCount) || 0));
        const addQty = Math.min(sisaSlot, Math.max(1, Number(document.getElementById('sub-unit-qty').value) || 0));
        const rate = Number(document.getElementById('sub-unit-rate').value) || 0;
        const costWl = tempSubsidiCalcMode === 'multiply' ? addQty * rate : (addQty / 200) * rate;

        prov.unitCount = (Number(prov.unitCount) || 0) + addQty;
        prov.totalModalWl = Number(((Number(prov.totalModalWl) || 0) + costWl).toFixed(2));

        saveState();
        playSfx('success');
        closeModal();
        renderCurrentTab();
        showToast(`+${formatNumber(addQty)} unit ditambahkan (+${formatNumber(costWl)} WL modal)!`);
    }

        const pMan = document.getElementById('tackle-panel-manual');

            bAuto.className = 'py-2.5 rounded-xl text-xs font-extrabold text-[#6E6A63]';

        const prov = appState.providers.find(p => p.id === provId);

        const ratio = (Number(prov.unitCount) || 0) / TACKLE_BENCHMARK_UNITS;

        BAIT_CONFIG.forEach(b => {
            const earned = Math.round(b.baseCount * ratio);
            appState.providerInventory.baits[b.key] = (Number(appState.providerInventory.baits[b.key]) || 0) + earned;
        });

        prov.readyAt = Date.now() + getEffectiveDurationMs('tackle');
        prov.notified = false;
        saveState();
        playSfx('success');
        closeModal();
        renderCurrentTab();
        showToast(`Hasil Tackle otomatis ditambahkan! Timer 48 jam dimulai.`);
    }

    function computeBaitsSaleBreakdown() {
        let totalWl = 0;
        const soldEntries = [];
        BAIT_CONFIG.forEach(b => {
            const stock = Number(appState.providerInventory.baits[b.key]) || 0;
            const qty = Math.min(stock, Math.max(0, Number(document.getElementById(`bait-sell-qty-${b.key}`)?.value) || 0));
            const rate = Number(document.getElementById(`bait-sell-rate-${b.key}`)?.value) || 0;
            const mode = tempBaitSellModes[b.key] || 'divide';
            if (qty > 0 && rate > 0) {
                const wl = mode === 'multiply' ? qty * rate : qty / rate;
                totalWl += wl;
                soldEntries.push({ key: b.key, name: b.name, qty, wl });
            }
        });
        return { totalWl: Number(totalWl.toFixed(2)), soldEntries };
    }

            <div class="neu-flat neu-card-interactive rounded-3xl p-4 space-y-3.5 border border-white/60">
                <div class="flex items-start justify-between gap-3">
                    <div class="flex items-center gap-3 min-w-0">
                        <div class="w-12 h-12 rounded-2xl neu-inset-sm flex items-center justify-center overflow-hidden shrink-0">

                        </div>
                        <div class="min-w-0">
                            <div class="flex items-center gap-1.5">
                                <h3 class="font-display font-extrabold text-sm text-[#24211E] truncate">${escapeHtml(item.name)}</h3>
                                <span class="text-[9px] font-extrabold px-2 py-0.5 rounded-full shrink-0 ${isGacha ? 'bg-amber-500/15 text-amber-700' : 'bg-[#EC5E27]/12 text-[#EC5E27]'}">

                    </div>

                    ${!isGacha ? `
                        <div class="text-right shrink-0">
                            <span class="font-display font-extrabold text-sm ${estProfit >= 0 ? 'text-emerald-600' : 'text-red-500'} block">
                                ${estProfit >= 0 ? '+' : ''}${formatNumber(estProfit)} WL
                            </span>
                            <span class="text-[10px] font-semibold text-[#6E6A63]">${formatBglDlWl(estProfit)}</span>
                        </div>
                    ` : ''}
                </div>

                ${!isGacha ? `
                    <div class="grid grid-cols-2 gap-2.5">
                        <div class="neu-inset-sm rounded-2xl p-2.5">
                            <span class="text-[10px] text-[#6E6A63] block">Modal Awal</span>
                            <span class="font-display font-extrabold text-xs text-[#24211E]">${formatBglDlWl(modal)}</span>

                    </button>

                    ${isGacha ? `
                        <button type="button" onclick="openArchiveModal('profitan', '${item.id}')" class="flex-1 py-2.5 px-4 rounded-2xl neu-accent-btn text-xs font-bold flex items-center justify-center gap-1.5">

                        <button type="button" onclick="openArchiveModal('profitan', '${item.id}')" class="flex-1 py-2.5 px-4 rounded-2xl neu-accent-btn text-xs font-bold flex items-center justify-center gap-1.5">
                            <i data-lucide="check-circle-2" class="w-4 h-4"></i>
                            Finish
                        </button>
                    `}
                </div>
            </div>
        `;

    function deleteProfitanItem(id) {
        appState.profitans = appState.profitans.filter(p => p.id !== id);
        saveState();
        renderCurrentTab();
        showToast('Item profitan dihapus.');
    }

    function openNewProfitanModal() {
        tempProfitanMode = 'beli';
        tempProfitanImage = '';
        renderProfitanModalContent();
    }

        const currentName = document.getElementById('prof-name')?.value || '';
        const currentNote = document.getElementById('prof-note')?.value || '';
        const currentModal = document.getElementById('prof-modal')?.value || '100';
        const currentTarget = document.getElementById('prof-target')?.value || '150';

        root.innerHTML = `
            <div class="fixed inset-0 z-50 modal-backdrop flex items-end justify-center" onclick="if(event.target===this) closeModal()">
                <div class="modal-sheet w-full max-w-[480px] rounded-t-[32px] p-6 max-h-[92vh] overflow-y-auto space-y-4 shadow-2xl border-t border-white">
                    <div class="flex items-center justify-between">
                        <div>
                            <h3 class="font-display font-extrabold text-base text-[#24211E]">Tambah Profitan Baru</h3>

                    <div class="grid grid-cols-2 gap-2.5 p-1.5 rounded-2xl neu-inset-sm">

                            <i data-lucide="shopping-bag" class="w-3.5 h-3.5"></i>
                            Beli
                        </button>
                        <button type="button" data-sfx="ui" onclick="setProfitanMode('gacha')" class="py-2.5 rounded-xl text-xs font-extrabold transition-all flex items-center justify-center gap-1.5 ${isGacha ? 'neu-accent-btn' : 'text-[#6E6A63]'}">

                            <label class="block text-xs font-bold text-[#24211E] mb-1.5">Gambar Item / Event (Opsional)</label>
                            <div class="flex items-center gap-3">
                                <div id="prof-img-preview" class="w-14 h-14 rounded-2xl neu-inset-sm flex items-center justify-center overflow-hidden shrink-0 text-[#EC5E27]">

                                    <button type="button" onclick="document.getElementById('prof-file-input').click()" class="px-3.5 py-2 rounded-xl neu-btn text-xs font-bold text-[#24211E] flex items-center gap-1.5">
                                        <i data-lucide="image-plus" class="w-3.5 h-3.5 text-[#EC5E27]"></i>
                                        Pilih Gambar Kustom
                                    </button>
                                    <p class="text-[10px] text-[#6E6A63]">PNG, JPG, atau WEBP dari galeri</p>
                                </div>
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-[#24211E] mb-1.5">Catatan / Strategi</label>

                        ${!isGacha ? `
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs font-bold text-[#24211E] mb-1.5">Modal Awal (WL)</label>
                                    <input type="number" id="prof-modal" required min="0" value="${escapeHtml(currentModal)}" oninput="updateProfitanEstPreview()" class="w-full px-4 py-3 rounded-2xl neu-input text-xs font-bold">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-[#24211E] mb-1.5">Target / Hasil Jual (WL)</label>
                                    <input type="number" id="prof-target" required min="0" value="${escapeHtml(currentTarget)}" oninput="updateProfitanEstPreview()" class="w-full px-4 py-3 rounded-2xl neu-input text-xs font-bold">
                                </div>
                            </div>

                            <div class="neu-inset-sm rounded-2xl px-4 py-3 flex items-center justify-between">
                                <span class="text-xs font-semibold text-[#6E6A63]">Estimasi Profit Bersih:</span>
                                <span id="prof-est-clean" class="font-display font-extrabold text-xs text-[#EC5E27]">+50 WL</span>
                            </div>
                        ` : `
                            <div class="neu-inset-sm rounded-2xl p-3 flex items-center gap-2.5 text-[11px] text-[#6E6A63]">
                                <i data-lucide="info" class="w-4 h-4 text-[#EC5E27] shrink-0"></i>
                                <span>Item <strong>Hasil Gacha</strong> disimpan tanpa target. Ketuk <strong>Sold</strong> kapan saja saat item laku terjual untuk mencatat WL hasil jual.</span>

    function setProfitanMode(mode) {
        tempProfitanMode = mode;
        renderProfitanModalContent();
    }

    function handleProfitanImageUpload(event) {
        const file = event.target.files?.[0];
        if (!file) return;
        compressImageFile(file, 320, (dataUrl) => {
            tempProfitanImage = dataUrl;
            const box = document.getElementById('prof-img-preview');
            if (box) box.innerHTML = `<img src="${dataUrl}" class="w-full h-full object-cover">`;
        });
    }

    function updateProfitanEstPreview() {
        const mEl = document.getElementById('prof-modal');
        const tEl = document.getElementById('prof-target');
        const outEl = document.getElementById('prof-est-clean');
        if (!mEl || !tEl || !outEl) return;

        const diff = (Number(tEl.value) || 0) - (Number(mEl.value) || 0);
        outEl.textContent = formatWlWithHierarchy(diff);
        outEl.className = `font-display font-extrabold text-xs ${diff >= 0 ? 'text-[#EC5E27]' : 'text-red-500'}`;
    }

    function submitNewProfitan(e) {
        e.preventDefault();
        const name = document.getElementById('prof-name').value.trim();
        const note = document.getElementById('prof-note').value.trim();
        if (!name) return;

        const isGacha = tempProfitanMode === 'gacha';
        const modalWl = isGacha ? 0 : (Number(document.getElementById('prof-modal')?.value) || 0);
        const targetWl = isGacha ? 0 : (Number(document.getElementById('prof-target')?.value) || 0);

        appState.profitans.unshift({
            id: 'prof-' + Date.now(),
            mode: tempProfitanMode,
            name,
            note,
            image: tempProfitanImage,
            modalWl,
            targetWl,
            createdAt: new Date().toLocaleDateString('id-ID', { day: '2-digit', month: 'short' })
        });

        saveState();
        playSfx('success');
        closeModal();
        renderCurrentTab();
        showToast(`Item "${name}" berhasil ditambahkan ke Profitan!`);
    }

    // ==========================================
    // UNIFIED MODAL: SELESAIKAN & ARSIPKAN (FINISH & SOLD)
    // ==========================================
    function openArchiveModal(source, id) {
        let item = null;
        let defaultSoldWl = 0;
        let modalAwal = 0;
        let labelAction = 'Finish Sekarang';

        if (source === 'project') {
            item = appState.projects.find(p => p.id === id);
            if (!item) return;
            defaultSoldWl = item.type === 'farming' ? Math.round(calculateFarmingEstWl(item)) : (Number(item.estValueWl) || 0);
            modalAwal = Number(item.modalWl) || 0;
            labelAction = 'Finish Sekarang';
        } else {
            item = appState.profitans.find(p => p.id === id);
            if (!item) return;
            modalAwal = item.mode === 'gacha' ? 0 : (Number(item.modalWl) || 0);
            defaultSoldWl = item.mode === 'gacha' ? '' : (Number(item.targetWl) || 0);
            labelAction = item.mode === 'gacha' ? 'Sold & Arsipkan' : 'Finish Sekarang';
        }

        activeArchiveTarget = { source, id, modalAwal };
        const initialSold = Number(defaultSoldWl) || 0;
        const initialClean = initialSold - modalAwal;

        const root = document.getElementById('modal-root');
        if (!root) return;
        root.innerHTML = `
            <div class="fixed inset-0 z-50 modal-backdrop flex items-center justify-center p-5" onclick="if(event.target===this) closeModal()">
                <div class="modal-dialog w-full max-w-[380px] rounded-[32px] p-6 text-center space-y-4 shadow-2xl border border-white">
                    <div class="w-12 h-12 rounded-2xl bg-[#EC5E27]/12 text-[#EC5E27] mx-auto flex items-center justify-center">
                        <i data-lucide="check-circle" class="w-6 h-6"></i>
                    </div>

                    <div>
                        <h3 class="font-display font-extrabold text-base text-[#24211E]">Selesaikan & Arsipkan?</h3>
                        <p class="text-xs text-[#6E6A63] mt-1">Masukkan nominal WL terjual untuk <strong>"${escapeHtml(item.name)}"</strong></p>
                    </div>

                    <form onsubmit="confirmArchiveSubmit(event)" class="space-y-3 text-left">
                        <div>
                            <label class="block text-xs font-bold text-[#24211E] mb-1.5">Nominal Terjual (WL)</label>
                            <input type="number" id="archive-sold-input" required min="0" step="any" value="${defaultSoldWl}" oninput="updateArchiveCleanProfit()" placeholder="Masukkan nominal terjual..." class="w-full px-4 py-3 rounded-2xl neu-input text-center font-display font-extrabold text-base text-[#EC5E27]">
                        </div>

                        <div class="neu-inset-sm rounded-2xl p-3 space-y-1.5 text-xs">
                            <div class="flex items-center justify-between text-[#6E6A63]">
                                <span>Modal Awal:</span>
                                <span class="font-bold text-[#24211E]">${formatBglDlWl(modalAwal)}</span>
                            </div>
                            <div class="flex items-center justify-between border-t border-[#E5E3D4] pt-1.5">
                                <span class="font-bold text-[#24211E]">Clean Profit Bersih:</span>
                                <span id="archive-clean-preview" class="font-display font-extrabold ${initialClean >= 0 ? 'text-emerald-600' : 'text-red-500'}">
                                    ${formatBglDlWl(initialClean)}
                                </span>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-2.5 pt-1">
                            <button type="button" data-sfx="ui" onclick="closeModal()" class="py-3 rounded-2xl neu-btn text-xs font-bold text-[#6E6A63]">Batal</button>
                            <button type="submit" class="py-3 rounded-2xl neu-accent-btn text-xs font-bold">${labelAction}</button>
                        </div>
                    </form>
                </div>
            </div>
        `;
        safeCreateIcons();
        setTimeout(() => {
            const inp = document.getElementById('archive-sold-input');
            if (inp) inp.focus();
        }, 80);
    }

    function updateArchiveCleanProfit() {
        if (!activeArchiveTarget) return;
        const inp = document.getElementById('archive-sold-input');
        const out = document.getElementById('archive-clean-preview');
        if (!inp || !out) return;

        const sold = Number(inp.value) || 0;
        const clean = sold - (Number(activeArchiveTarget.modalAwal) || 0);
        out.textContent = formatBglDlWl(clean);
        out.className = `font-display font-extrabold ${clean >= 0 ? 'text-emerald-600' : 'text-red-500'}`;
    }

    function confirmArchiveSubmit(e) {
        e.preventDefault();
        if (!activeArchiveTarget) return;
        const soldWl = Number(document.getElementById('archive-sold-input')?.value) || 0;
        const { source, id, modalAwal } = activeArchiveTarget;
        const cleanProfit = Number((soldWl - modalAwal).toFixed(2));

        let itemName = '';
        let category = '';

        if (source === 'project') {
            const idx = appState.projects.findIndex(p => p.id === id);
            if (idx === -1) return;
            const proj = appState.projects[idx];
            itemName = proj.name;
            category = proj.type === 'farming' ? 'Project Farming' : 'Project Ngemass';
            appState.projects.splice(idx, 1);
        } else {
            const idx = appState.profitans.findIndex(p => p.id === id);
            if (idx === -1) return;
            const prof = appState.profitans[idx];
            itemName = prof.name;
            category = prof.mode === 'gacha' ? 'Profitan (Hasil Gacha)' : 'Profitan (Beli)';
            appState.profitans.splice(idx, 1);
        }

        const nowLabel = new Date().toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
        appState.history.unshift({
            id: 'hist-' + Date.now(),
            category,
            name: itemName,
            soldWl,
            modalWl: modalAwal,
            cleanProfit,
            date: nowLabel
        });

        activeArchiveTarget = null;
        saveState();
        playSfx('success');
        closeModal();
        renderCurrentTab();
        showToast(`"${itemName}" diarsipkan! Clean Profit: ${formatBglDlWl(cleanProfit)}`);
    }

    function closeModal() {
        const root = document.getElementById('modal-root');
        if (root) root.innerHTML = '';
    }

    // ==========================================
    // IMAGE COMPRESSION & HTML ESCAPE HELPERS
    // ==========================================
    function compressImageFile(file, maxSize, callback) {
        const reader = new FileReader();
        reader.onload = function (ev) {
            const img = new Image();
            img.onload = function () {
                const canvas = document.createElement('canvas');
                let w = img.width;
                let h = img.height;
                if (w > maxSize || h > maxSize) {
                    if (w > h) {
                        h = Math.round((h * maxSize) / w);
                        w = maxSize;
                    } else {
                        w = Math.round((w * maxSize) / h);
                        h = maxSize;
                    }
                }
                canvas.width = w;
                canvas.height = h;
                const ctx = canvas.getContext('2d');
                if (ctx) {
                    ctx.drawImage(img, 0, 0, w, h);
                    callback(canvas.toDataURL('image/jpeg', 0.8));
                } else {
                    callback(ev.target.result);
                }
            };
            img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
    }

    function escapeHtml(str) {
        return String(str ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    // ==========================================
    // PWA (MANIFEST, SERVICE WORKER & NOTIFIKASI - BRIGHT #FDFDF1)
    // ==========================================
    let deferredInstallPrompt = null;

    function initPwaEnvironment() {
        try {
            const icon192 = getXikaiBrandIconUrl(192);
            const icon512 = getXikaiBrandIconUrl(512);

            const appleTouch = document.createElement('link');
            appleTouch.rel = 'apple-touch-icon';
            appleTouch.href = icon192;
            document.head.appendChild(appleTouch);

            const manifestObj = {
                name: 'XIKAI ASSET - Financial & Asset Manager',
                short_name: 'XIKAI ASSET',
                description: 'Manajemen Project Farming, Ngemass, Provider, dan Profitan.',
                start_url: window.location.href,
                scope: './',
                display: 'standalone',
                orientation: 'portrait',
                theme_color: '#FDFDF1',
                background_color: '#FDFDF1',
                icons: [
                    { src: icon192, sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
                    { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
                ]
            };

            const manifestBlob = new Blob([JSON.stringify(manifestObj)], { type: 'application/manifest+json' });
            const manifestUrl = URL.createObjectURL(manifestBlob);
            const manifestLink = document.createElement('link');
            manifestLink.rel = 'manifest';
            manifestLink.href = manifestUrl;
            document.head.appendChild(manifestLink);

            if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost')) {
                const swCode = `
                    const CACHE_NAME = 'xikai-asset-public-v2';
                    self.addEventListener('install', (event) => { self.skipWaiting(); });
                    self.addEventListener('activate', (event) => { event.waitUntil(self.clients.claim()); });
                    self.addEventListener('fetch', (event) => {
                        if (event.request.method !== 'GET') return;
                        event.respondWith(
                            fetch(event.request)
                                .then((response) => {
                                    const copy = response.clone();
                                    caches.open(CACHE_NAME).then((cache) => cache.put(event.request, copy)).catch(() => {});
                                    return response;
                                })
                                .catch(() => caches.match(event.request))
                        );
                    });
                    self.addEventListener('notificationclick', (event) => {
                        event.notification.close();
                        event.waitUntil(self.clients.openWindow('/'));
                    });
                `;
                const swBlob = new Blob([swCode], { type: 'application/javascript' });
                const swUrl = URL.createObjectURL(swBlob);
                navigator.serviceWorker.register(swUrl).catch(() => {});
            }
        } catch (err) {}
    }

        if (!('Notification' in window)) return 'bg-[#E2E2D3] text-[#6E6A63]';

        if (Notification.permission === 'denied') return 'bg-red-500/15 text-red-600';

    async function requestAppNotification() {
        if (!('Notification' in window)) {
            showToast('Browser Anda belum mendukung fitur notifikasi.');
            return;
        }
        if (Notification.permission === 'granted') {
            showToast('Notifikasi XIKAI ASSET sudah aktif!');
            renderCurrentTab();
            return;
        }
        if (Notification.permission === 'denied') {
            showToast('Izin notifikasi diblokir. Aktifkan melalui pengaturan situs browser Anda.');
            renderCurrentTab();
            return;
        }
        try {
            const permission = await Notification.requestPermission();
            if (permission === 'granted') {
                showToast('Notifikasi XIKAI ASSET berhasil diaktifkan!');
                playProviderReadySound();
                dispatchSystemNotification('XIKAI ASSET Notifikasi Aktif', 'Anda akan menerima notifikasi saat timer Provider selesai.');
            } else {
                showToast('Izin notifikasi tidak diberikan.');
            }
            renderCurrentTab();
